# PRÜFGLEIS. Läuft bei jedem Push und jedem Pull Request.
#
# Als dieses Gleis entstand, gab es 43 Testdateien und 27 Wächter — und keinen Auslöser, der
# sie fährt. Sie liefen genau dann, wenn jemand daran dachte. Ein Wächter, den
# niemand startet, prüft nichts (dieselbe Klasse wie Anmerkung 108: eine
# Prüfung, die nie gegen den Defekt läuft, ist keine).
#
# Bewusst eine dritte Datei neben den zwei Docker-Gleisen (Anmerkung 86): die
# haben Pfadfilter und brechen laufende Bauten ab, was für Testbauten richtig
# ist. Prüfungen dürfen weder gefiltert noch abgebrochen werden — ein
# übersprungener Test sieht aus wie ein bestandener.
name: Tests

on:
  push:
    branches: ["main"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  # ------------------------------------------------------------------------ #
  # Backend — dieselbe Suite zweimal: SQLite (schnell, wie bisher) und
  # PostgreSQL (das, worauf betrieben wird).
  # ------------------------------------------------------------------------ #
  backend:
    runs-on: ubuntu-latest

    services:
      # Dieselbe Hauptversion wie in docker-compose.yml. Eine andere zu testen
      # als die, die läuft, ist die halbe Zusicherung.
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_PASSWORD: test
          POSTGRES_DB: lifedash_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: |
            backend/requirements.txt
            backend/requirements-dev.txt

      - name: Abhängigkeiten
        run: pip install -r backend/requirements-dev.txt

      # Erst SQLite: der Lauf, den auch jeder lokal fährt. Scheitert er, ist
      # der PostgreSQL-Lauf danach uninteressant.
      - name: Tests auf SQLite
        working-directory: backend
        run: python -m pytest tests -q

      # Dann PostgreSQL. Die Fehlerklasse dahinter ist die, die auf SQLite
      # NICHT auffällt: native Enum-Typen, JSON gegen JSONB, `round()` auf
      # `double precision`, der PostgreSQL-Zweig der Migrationen.
      - name: Tests auf PostgreSQL
        working-directory: backend
        env:
          TEST_DATABASE_URL: postgresql+psycopg2://postgres:test@localhost:5432/lifedash_test
        run: python -m pytest tests -q

  # ------------------------------------------------------------------------ #
  # Frontend — die jsdom-Wächter aus tools/.
  # ------------------------------------------------------------------------ #
  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # `npm ci` gegen eine EINGECHECKTE tools/package-lock.json. Die Lockdatei
      # war bis 2026-08-04 ignoriert, mit der Begründung, ein einziger
      # Dev-Dependency sei den Aufwand nicht wert — das ist der falsche Maßstab.
      # Der Dependency ist jsdom, und die Wächter prüfen nicht IHREN Code,
      # sondern das VERHALTEN einer DOM-Nachbildung: `^26.0.0` heißt, die CI
      # darf eine andere Unterversion ziehen als du lokal. Ein Wächter, der hier
      # anders urteilt als bei dir, ist genau der Fall aus Anm. 108 — eine
      # Prüfung, die nicht das prüft, was du geprüft glaubst.
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: tools/package-lock.json

      - name: Abhängigkeiten
        working-directory: tools
        run: npm ci --no-audit --no-fund

      - name: Wächter
        working-directory: tools
        run: npm run check

  # ------------------------------------------------------------------------ #
  # Anmerkung 220 — der Lauf gegen einen LAUFENDEN Server.
  #
  # `live-check.js` gab es seit A37 und stand in keinem Auslöser: er braucht
  # einen Server, also lief er genau dann, wenn jemand daran dachte. Das ist
  # wörtlich die Begründung im Kopf dieser Datei, nur eine Ebene tiefer — und
  # er ist der EINZIGE Lauf, der das echte Frontend gegen echte Antworten
  # stellt. Alle anderen arbeiten mit Attrappen.
  #
  # **Mit Demo-Bestand, und das ist die Bedingung, nicht die Bequemlichkeit.**
  # Anmerkung 220 war eine Abfrage, die quadratisch über den Bestand lief:
  # über einer leeren Datenbank ist sie schnell, über den ausgelieferten 8.500
  # Ereignissen brauchte der Statistik-Reiter neunundzwanzig Sekunden. Ein
  # Lauf, der nichts in der Datenbank hat, hätte auch das nicht gesehen.
  # ------------------------------------------------------------------------ #
  live:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: tools/package-lock.json

      - name: Abhängigkeiten
        run: |
          pip install -r backend/requirements.txt
          cd tools && npm ci --no-audit --no-fund

      # Scratch-Datenbank, Mock-KI, kein Geocoding — dieselbe Beschwörung wie
      # im Kopf von live-check.js und in CLAUDE.md. Der Demo-Seed braucht rund
      # zwölf Sekunden und kein Netz.
      - name: Smoke-Server mit Demo-Bestand
        working-directory: backend
        env:
          DATABASE_URL: sqlite:///./_ci.db
          AUTH_MODE: dev
          AI_PROVIDER: mock
          SEED_DEMO: "true"
          GEOCODING_ENABLED: "false"
        run: |
          python -m uvicorn app.main:app --port 8123 > /tmp/server.log 2>&1 &
          # Auf die BEDINGUNG warten, nicht auf eine Frist: der Seed läuft
          # nach dem ersten /health durch, und ein festes `sleep` ist auf einem
          # geteilten Runner entweder zu kurz oder verschenkte Zeit.
          for i in $(seq 1 60); do
            curl -sf http://127.0.0.1:8123/api/events/index >/dev/null && break
            sleep 2
          done
          curl -sf http://127.0.0.1:8123/api/events/index >/dev/null \
            || { echo "Server kam nicht hoch:"; cat /tmp/server.log; exit 1; }

      # Das Budget ist großzügig: der Runner ist geteilt und langsamer als jede
      # echte Instanz. Es soll keine Millisekunden bewachen, sondern die
      # Größenordnung — der Defekt aus Anmerkung 220 lag bei 15.000 ms.
      - name: Live-Lauf gegen das echte Frontend
        env:
          LIVE_BUDGET_MS: "8000"
        run: node tools/live-check.js http://127.0.0.1:8123

      - name: Serverlog bei Fehlschlag
        if: failure()
        run: cat /tmp/server.log
