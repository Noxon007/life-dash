[pytest]
# Eine Warnung ist ein Fehler. Starlette meldete bei JEDEM Lauf, dass `httpx`
# veraltet ist — und eine Warnung, die jeder Lauf zeigt, liest niemand mehr,
# auch nicht die nächste, die etwas bedeutet. Die strenge Regel fand sofort
# zwei Lecks, die Python still übergangen hatte (`ResourceWarning` ist
# standardmäßig aus): eine offene Datei und eine nie freigegebene Engine. Hier und nicht als `-W error`
# im Aufruf, weil CI, `tools/pg-test.ps1` und der Lauf von Hand sonst drei
# Stellen für eine Regel wären.
#
# Wer eine Warnung bewusst hinnimmt, trägt sie hier einzeln ein, mit Grund —
# nie pauschal.
filterwarnings =
    error
