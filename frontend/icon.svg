<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128">
  <!-- Life-Dash — die Biene (Entwurf 06 der Zeichenwahl, 2026-08-04).
       Sie sammelt, legt in Zellen ab und teilt im Tanz mit, WO etwas war —
       genau das, was dieses Werkzeug tut. Die Wabe (icon-comb.svg) ist ihr
       Gegenstück: die Zellen, in denen es liegt.
       Geprüft bei 16 px: Kopf, Leib und drei Streifen bleiben lesbar. -->
  <defs>
    <linearGradient id="g" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#5b8cff"/>
      <stop offset="1" stop-color="#35c4a7"/>
    </linearGradient>
    <clipPath id="cl-bee"><ellipse cx="64" cy="80" rx="24" ry="30"/></clipPath>
  </defs>
  <rect width="128" height="128" rx="28" fill="#0f1420"/>
  <ellipse cx="34" cy="50" rx="19" ry="11" fill="#5b8cff" opacity=".5" transform="rotate(-30 34 50)"/>
  <ellipse cx="94" cy="50" rx="19" ry="11" fill="#5b8cff" opacity=".5" transform="rotate(30 94 50)"/>
  <path d="M54 26 L48 14 M74 26 L80 14" stroke="url(#g)" stroke-width="5" stroke-linecap="round"/>
  <circle cx="64" cy="40" r="15" fill="url(#g)"/>
  <ellipse cx="64" cy="80" rx="24" ry="30" fill="url(#g)"/>
  <g clip-path="url(#cl-bee)">
    <rect x="36" y="62" width="56" height="9" fill="#0f1420"/>
    <rect x="36" y="80" width="56" height="9" fill="#0f1420"/>
    <rect x="36" y="98" width="56" height="9" fill="#0f1420"/>
  </g>
</svg>
